name: Validate examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the repository. The repository default is
# write so the auto-merge job can merge; pinning it here keeps this workflow at
# what it actually needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml jinja2
      - run: python scripts/validate_examples.py
